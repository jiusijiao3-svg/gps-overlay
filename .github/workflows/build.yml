name: Build GPS Overlay APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Setup Fixed Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12

    - name: Generate Source Files
      run: |
        mkdir -p app/src/main/java/com/example/gpsoverlay
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values

        echo "android.useAndroidX=true" > gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "GpsOverlay"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.example.gpsoverlay"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.gpsoverlay"
                minSdk = 26
                targetSdk = 34
                versionCode = 18
                versionName = "3.3"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.exifinterface:exifinterface:1.3.7")
        }
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources><string name="app_name">GPS Overlay</string></resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/circle_shape.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#FF0000" />
            <size android:width="28dp" android:height="28dp" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/banner_bg.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <corners android:radius="16dp" />
            <padding android:left="16dp" android:top="8dp" android:right="16dp" android:bottom="8dp" />
            <solid android:color="#E61B1B1B" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/layout/overlay_view.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:gravity="center_horizontal"
            android:padding="8dp">
            <View
                android:id="@+id/status_circle"
                android:layout_width="26dp"
                android:layout_height="26dp"
                android:background="@drawable/circle_shape" />
            <TextView
                android:id="@+id/accuracy_text"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="3dp"
                android:text="測位中..."
                android:textColor="#FFFFFF"
                android:textSize="12sp"
                android:textStyle="bold"
                android:shadowColor="#000000"
                android:shadowDx="1"
                android:shadowDy="1"
                android:shadowRadius="3" />
            <TextView
                android:id="@+id/satellite_text"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="衛星: -"
                android:textColor="#FFFFFF"
                android:textSize="10sp"
                android:shadowColor="#000000"
                android:shadowDx="1"
                android:shadowDy="1"
                android:shadowRadius="3" />
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/banner_view.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content">
            <TextView
                android:id="@+id/hud_banner_text"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="center_horizontal"
                android:layout_marginTop="28dp"
                android:background="@drawable/banner_bg"
                android:textColor="#FFFFFF"
                android:textSize="12sp"
                android:textStyle="bold"
                android:elevation="10dp"
                android:gravity="center"
                android:shadowColor="#000000"
                android:shadowDx="1"
                android:shadowDy="1"
                android:shadowRadius="2"
                android:visibility="gone" />
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

            <application
                android:label="GPS Overlay"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".OverlayService"
                    android:foregroundServiceType="location"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/gpsoverlay/MainActivity.kt
        package com.example.gpsoverlay
        import android.Manifest
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Environment
        import android.provider.MediaStore
        import android.provider.Settings
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {
            private val permissions = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION).apply {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    add(Manifest.permission.POST_NOTIFICATIONS)
                }
            }
            private val permissionLauncher = registerForActivityResult(
                ActivityResultContracts.RequestMultiplePermissions()
            ) { grants ->
                if (grants[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                    checkAndProceed()
                } else {
                    Toast.makeText(this, "高精度位置情報の許可が必要です", Toast.LENGTH_SHORT).show()
                    finish()
                }
            }
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val allGranted = permissions.all {
                    ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
                }
                if (allGranted) checkAndProceed() else permissionLauncher.launch(permissions.toTypedArray())
            }

            private fun checkAndProceed() {
                if (!Settings.canDrawOverlays(this)) {
                    Toast.makeText(this, "「他のアプリの上に重ねて表示」を許可してください", Toast.LENGTH_LONG).show()
                    startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                    finish()
                    return
                }

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                    if (!Environment.isExternalStorageManager()) {
                        Toast.makeText(this, "Exif自動上書きのため「すべてのファイルへのアクセス」を許可してください", Toast.LENGTH_LONG).show()
                        val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION).apply {
                            data = Uri.parse("package:$packageName")
                        }
                        startActivity(intent)
                        finish()
                        return
                    }
                }

                startForegroundService(Intent(this, OverlayService::class.java))
                val cameraIntent = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA).apply {
                    setPackage("com.google.android.GoogleCamera")
                    flags = Intent.FLAG_ACTIVITY_NEW_TASK
                }
                try {
                    startActivity(cameraIntent)
                } catch (e: Exception) {
                    startActivity(Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA).apply {
                        flags = Intent.FLAG_ACTIVITY_NEW_TASK
                    })
                }
                finish()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/gpsoverlay/OverlayService.kt
        package com.example.gpsoverlay
        import android.app.*
        import android.content.ContentResolver
        import android.content.Context
        import android.content.Intent
        import android.content.res.ColorStateList
        import android.database.ContentObserver
        import android.graphics.Color
        import android.graphics.PixelFormat
        import android.location.GnssStatus
        import android.location.Location
        import android.location.LocationListener
        import android.location.LocationManager
        import android.media.MediaScannerConnection
        import android.net.Uri
        import android.os.*
        import android.provider.MediaStore
        import android.util.Log
        import android.view.*
        import android.widget.TextView
        import androidx.core.app.NotificationCompat
        import androidx.exifinterface.media.ExifInterface
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.*
        import java.util.concurrent.ConcurrentLinkedQueue
        import java.util.concurrent.Executors
        import kotlin.math.abs
        import kotlin.math.sqrt

        private const val TAG = "GpsOverlay/Service"

        data class GpsRecord(val timeMs: Long, val lat: Double, val lon: Double, val alt: Double, val acc: Float)

        class OverlayService : Service(), LocationListener {
            private lateinit var windowManager: WindowManager
            private lateinit var overlayView: View
            private lateinit var statusCircle: View
            private lateinit var accuracyText: TextView
            private lateinit var satelliteText: TextView
            private lateinit var bannerContainer: ViewGroup
            private lateinit var hudBannerText: TextView
            private lateinit var locationManager: LocationManager
            private val accuracyThreshold = 5.0f

            private val gpsLog = ConcurrentLinkedQueue<GpsRecord>()
            private val processedPaths = Collections.synchronizedSet(HashSet<String>())
            private val executor = Executors.newSingleThreadExecutor()
            private var imageObserver: ContentObserver? = null
            private var satellitesUsed = 0
            private var satellitesTotal = 0
            private val mainHandler = Handler(Looper.getMainLooper())
            
            private val hideBannerRunnable = Runnable {
                try {
                    if (::hudBannerText.isInitialized) hudBannerText.visibility = View.GONE
                } catch (e: Exception) {}
            }

            private val debounceProcessRunnable = Runnable {
                executor.execute { processImageEvent() }
            }

            private val gnssCallback = object : GnssStatus.Callback() {
                override fun onSatelliteStatusChanged(status: GnssStatus) {
                    var used = 0
                    for (i in 0 until status.satelliteCount) {
                        if (status.usedInFix(i)) used++
                    }
                    satellitesUsed = used
                    satellitesTotal = status.satelliteCount
                    mainHandler.post {
                        if (::satelliteText.isInitialized) {
                            satelliteText.text = "衛星: $satellitesUsed/$satellitesTotal"
                        }
                    }
                }
            }

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                if (intent?.action == "ACTION_STOP") {
                    stopSelf()
                    return START_NOT_STICKY
                }
                return START_STICKY
            }

            override fun onCreate() {
                super.onCreate()
                startNotification()
                initOverlay()
                initBanner()
                writeDebugLog("=== GPS Overlay サービス起動 (v3.3) ===")
                startLocationUpdates()
                setupImageObserver()
            }

            private fun writeDebugLog(message: String) {
                Log.i(TAG, message)
                try {
                    val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM), "Camera")
                    if (!dir.exists()) dir.mkdirs()
                    val logFile = File(dir, "gps_sync.log")
                    val timeStr = SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", Locale.getDefault()).format(Date())
                    logFile.appendText("[$timeStr] $message\n")
                    
                    MediaScannerConnection.scanFile(
                        applicationContext,
                        arrayOf(logFile.absolutePath),
                        arrayOf("text/plain")
                    ) { _, _ -> }
                } catch (e: Exception) {
                    Log.e(TAG, "ログ書き込み失敗", e)
                }
            }

            private fun initOverlay() {
                windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_view, null)
                statusCircle = overlayView.findViewById(R.id.status_circle)
                accuracyText = overlayView.findViewById(R.id.accuracy_text)
                satelliteText = overlayView.findViewById(R.id.satellite_text)

                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 100; y = 200
                }

                var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f; var lastTap = 0L
                overlayView.setOnTouchListener { _, event ->
                    when (event.action) {
                        MotionEvent.ACTION_DOWN -> {
                            val now = System.currentTimeMillis()
                            if (now - lastTap < 350) {
                                stopSelf()
                                return@setOnTouchListener true
                            }
                            lastTap = now
                            initX = params.x; initY = params.y
                            touchX = event.rawX; touchY = event.rawY
                            true
                        }
                        MotionEvent.ACTION_MOVE -> {
                            params.x = initX + (event.rawX - touchX).toInt()
                            params.y = initY + (event.rawY - touchY).toInt()
                            windowManager.updateViewLayout(overlayView, params)
                            true
                        }
                        else -> false
                    }
                }
                windowManager.addView(overlayView, params)
            }

            private fun initBanner() {
                bannerContainer = LayoutInflater.from(this).inflate(R.layout.banner_view, null) as ViewGroup
                hudBannerText = bannerContainer.findViewById(R.id.hud_banner_text)

                val bannerParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP
                    y = 0
                }
                windowManager.addView(bannerContainer, bannerParams)
            }

            private fun showHudBanner(message: String, isSuccess: Boolean) {
                val colorHex = if (isSuccess) "#2E7D32" else "#C62828"
                showHudBannerRaw(message, colorHex, 4000L)
            }

            private fun showHudBannerRaw(message: String, hexColor: String, autoHideMs: Long) {
                mainHandler.post {
                    try {
                        if (!::hudBannerText.isInitialized) return@post
                        mainHandler.removeCallbacks(hideBannerRunnable)

                        hudBannerText.text = message
                        hudBannerText.backgroundTintList = ColorStateList.valueOf(Color.parseColor(hexColor))
                        hudBannerText.visibility = View.VISIBLE

                        val hideDelay = if (autoHideMs > 0L) autoHideMs else 5000L
                        mainHandler.postDelayed(hideBannerRunnable, hideDelay)
                    } catch (e: Exception) {}
                }
            }

            private fun startLocationUpdates() {
                locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                try {
                    locationManager.requestLocationUpdates(
                        LocationManager.GPS_PROVIDER,
                        500L,
                        0f,
                        this,
                        Looper.getMainLooper()
                    )
                    locationManager.registerGnssStatusCallback(gnssCallback, mainHandler)
                } catch (e: SecurityException) {
                    Log.e(TAG, "位置情報権限不足", e)
                }
            }

            override fun onLocationChanged(loc: Location) {
                if (!loc.hasAccuracy()) return
                val now = System.currentTimeMillis()
                val acc = loc.accuracy

                gpsLog.add(GpsRecord(now, loc.latitude, loc.longitude, loc.altitude, acc))
                val fiveMinAgo = now - 300_000L
                while (gpsLog.isNotEmpty() && gpsLog.peek().timeMs < fiveMinAgo) {
                    gpsLog.poll()
                }

                accuracyText.text = "±${acc.toInt()}m"
                val color = if (acc <= accuracyThreshold) "#00E676" else "#FF1744"
                statusCircle.backgroundTintList = ColorStateList.valueOf(Color.parseColor(color))
            }

            private fun setupImageObserver() {
                imageObserver = object : ContentObserver(mainHandler) {
                    override fun onChange(selfChange: Boolean, uri: Uri?) {
                        super.onChange(selfChange, uri)
                        showHudBannerRaw("📸 現像待ち・照合準備中...", "#0288D1", 5000L)
                        mainHandler.removeCallbacks(debounceProcessRunnable)
                        mainHandler.postDelayed(debounceProcessRunnable, 1200L)
                    }
                }
                contentResolver.registerContentObserver(
                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                    true,
                    imageObserver!!
                )
            }

            private fun processImageEvent() {
                writeDebugLog("--- 本番同期処理開始 (現像完了検知) ---")
                var isBannerUpdated = false

                val projection = arrayOf(
                    MediaStore.Images.Media._ID,
                    MediaStore.Images.Media.DATA,
                    MediaStore.Images.Media.DATE_TAKEN,
                    MediaStore.Images.Media.DATE_ADDED
                )

                try {
                    val cursor = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                        val queryArgs = Bundle().apply {
                            putString(ContentResolver.QUERY_ARG_SQL_SELECTION, "${MediaStore.Images.Media.DATA} LIKE ?")
                            putStringArray(ContentResolver.QUERY_ARG_SQL_SELECTION_ARGS, arrayOf("%DCIM/Camera%"))
                            putStringArray(ContentResolver.QUERY_ARG_SORT_COLUMNS, arrayOf(MediaStore.Images.Media._ID))
                            putInt(ContentResolver.QUERY_ARG_SORT_DIRECTION, ContentResolver.QUERY_SORT_DIRECTION_DESCENDING)
                            putInt(ContentResolver.QUERY_ARG_LIMIT, 1)
                        }
                        contentResolver.query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, projection, queryArgs, null)
                    } else {
                        contentResolver.query(
                            MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                            projection,
                            "${MediaStore.Images.Media.DATA} LIKE ?",
                            arrayOf("%DCIM/Camera%"),
                            "${MediaStore.Images.Media._ID} DESC LIMIT 1"
                        )
                    }

                    if (cursor == null) {
                        writeDebugLog("⚠ エラー: Cursorがnull")
                        showHudBanner("⚠ 失敗: データベース応答なし", false)
                        isBannerUpdated = true
                        return
                    }

                    cursor.use { c ->
                        if (!c.moveToFirst()) {
                            writeDebugLog("⚠ エラー: DCIM/Camera内に写真が見つかりません")
                            showHudBanner("⚠ 失敗: 写真データが見つかりません", false)
                            isBannerUpdated = true
                            return
                        }

                        val filePath = c.getString(c.getColumnIndexOrThrow(MediaStore.Images.Media.DATA)) ?: ""
                        val dateTaken = c.getLong(c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_TAKEN))
                        val dateAddedSec = c.getLong(c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED))

                        writeDebugLog("対象写真特定: $filePath")

                        if (processedPaths.contains(filePath)) {
                            writeDebugLog("スキップ: すでに同期処理済みの写真です")
                            isBannerUpdated = true
                            mainHandler.post(hideBannerRunnable)
                            return
                        }

                        val file = File(filePath)
                        if (!file.exists()) {
                            writeDebugLog("⚠ エラー: ファイルが存在しません")
                            showHudBanner("⚠ 失敗: ファイル未検出", false)
                            isBannerUpdated = true
                            return
                        }

                        writeDebugLog("ファイル安定化待機開始...")
                        if (!waitForFileStable(file, 5000L, 200L)) {
                            writeDebugLog("⚠ 警告: ファイルサイズが安定しないまま処理を続行します")
                        }

                        if (!file.canWrite()) {
                            writeDebugLog("⚠ エラー: ファイルの書き込み権限がありません")
                            showHudBanner("⚠ 失敗: 書き込み権限不足", false)
                            isBannerUpdated = true
                            return
                        }

                        val effectiveTimestamp = if (dateTaken > 0L) dateTaken else dateAddedSec * 1000L
                        writeAndVerifyGeotag(file, effectiveTimestamp)
                        isBannerUpdated = true
                    }
                } catch (e: Exception) {
                    writeDebugLog("⚠ クエリ例外発生: ${e.javaClass.simpleName} - ${e.message}")
                    Log.e(TAG, "クエリ例外", e)
                    showHudBanner("⚠ 失敗: クエリエラー (${e.javaClass.simpleName})", false)
                    isBannerUpdated = true
                } finally {
                    if (!isBannerUpdated) {
                        mainHandler.post(hideBannerRunnable)
                        writeDebugLog("処理終了 (バナー非表示)")
                    }
                }
            }

            private fun waitForFileStable(file: File, maxWaitMs: Long = 5000L, pollMs: Long = 200L): Boolean {
                var lastSize = -1L
                var stableCount = 0
                val start = System.currentTimeMillis()
                while (System.currentTimeMillis() - start < maxWaitMs) {
                    val size = if (file.exists()) file.length() else -1L
                    if (size > 0L && size == lastSize) {
                        stableCount++
                        if (stableCount >= 2) return true
                    } else {
                        stableCount = 0
                    }
                    lastSize = size
                    try { Thread.sleep(pollMs) } catch (e: InterruptedException) { return false }
                }
                return false
            }

            // ★改良：重心ベースのジッター統計を算出
            private fun jitterStats(samples: List<GpsRecord>): Pair<Float, Float> {
                var latSum = 0.0; var lonSum = 0.0
                for (s in samples) { latSum += s.lat; lonSum += s.lon }
                val centerLat = latSum / samples.size
                val centerLon = lonSum / samples.size

                var maxDist = 0f
                var sqSum = 0.0
                val results = FloatArray(1)
                for (s in samples) {
                    Location.distanceBetween(centerLat, centerLon, s.lat, s.lon, results)
                    maxDist = maxOf(maxDist, results[0])
                    sqSum += (results[0] * results[0]).toDouble()
                }
                val rms = sqrt(sqSum / samples.size).toFloat()
                return Pair(maxDist, rms)
            }

            private fun writeAndVerifyGeotag(file: File, dateTaken: Long) {
                val snapshot = gpsLog.toList()
                if (snapshot.isEmpty()) {
                    showHudBanner("⚠ 失敗: 生GPSログが空です", false)
                    writeDebugLog("失敗: 生GPSログが空です")
                    return
                }

                // 窓を±4秒（計8秒間）に適正化
                val nearWindow = snapshot.filter { abs(it.timeMs - dateTaken) < 4_000 }
                
                // 重心ベースで静止判定（窓内の全点が重心から半径6m以内に収まっているか）
                val isStat = if (nearWindow.size >= 2) {
                    val (maxDist, rms) = jitterStats(nearWindow)
                    val stat = maxDist < 6.0f
                    writeDebugLog("重心最大ズレ: ${String.format("%.1f", maxDist)}m / RMS: ${String.format("%.1f", rms)}m / 静止判定(6m): $stat")
                    stat
                } else {
                    false
                }

                if (nearWindow.isNotEmpty()) {
                    val accListStr = nearWindow.joinToString(", ") { "acc=${it.acc.toInt()}m" }
                    writeDebugLog("窓内サンプル(${nearWindow.size}点): [$accListStr]")
                }

                val record = if (isStat) {
                    weightedAverage(nearWindow)
                } else {
                    snapshot.minByOrNull { abs(it.timeMs - dateTaken) }
                }

                if (record == null || abs(record.timeMs - dateTaken) > 40_000) {
                    showHudBanner("⚠ 失敗: 撮影時刻の生GPSログなし", false)
                    writeDebugLog("失敗: 撮影時刻の生GPSログなし (撮影時刻: $dateTaken)")
                    return
                }

                val beforeExif = try { ExifInterface(file.absolutePath) } catch (e: Exception) { null }
                val beforeLatLon = beforeExif?.latLong

                writeDebugLog("=== Exif上書き同期実行 ===")
                writeDebugLog("書き込み前Exif: ${beforeLatLon?.get(0)}, ${beforeLatLon?.get(1)}")
                writeDebugLog("上書き座標: lat=${record.lat}, lon=${record.lon}, acc=${record.acc}")

                try {
                    val exif = ExifInterface(file.absolutePath)
                    exif.setLatLong(record.lat, record.lon)
                    exif.setAltitude(record.alt)
                    exif.setAttribute(ExifInterface.TAG_GPS_PROCESSING_METHOD, "RAW_GNSS_OVERLAY")
                    exif.saveAttributes()

                    val verifyExif = ExifInterface(file.absolutePath)
                    val afterLatLon = verifyExif.latLong

                    writeDebugLog("書き込み後Exif: ${afterLatLon?.get(0)}, ${afterLatLon?.get(1)}")

                    val actuallyChanged = beforeLatLon == null ||
                        abs(beforeLatLon[0] - (afterLatLon?.get(0) ?: 0.0)) > 0.00001 ||
                        abs(beforeLatLon[1] - (afterLatLon?.get(1) ?: 0.0)) > 0.00001

                    val isVerified = afterLatLon != null &&
                        abs(afterLatLon[0] - record.lat) < 0.0001 &&
                        abs(afterLatLon[1] - record.lon) < 0.0001

                    writeDebugLog("変化あり: $actuallyChanged / 照合成功: $isVerified")

                    if (isVerified) {
                        processedPaths.add(file.absolutePath)
                        MediaScannerConnection.scanFile(
                            applicationContext,
                            arrayOf(file.absolutePath),
                            arrayOf("image/jpeg")
                        ) { _, _ -> }

                        val tag = if (actuallyChanged) "変化あり" else "変化なし"
                        val sampleText = if (isStat) "(${nearWindow.size}点平均)" else "(1点)"
                        val summary = "✓ 同期成功[$tag]: ±${record.acc.toInt()}m $sampleText"
                        
                        writeDebugLog("結果: $summary")
                        showHudBanner(summary, true)
                    } else {
                        writeDebugLog("結果: 照合不一致")
                        showHudBanner("⚠ 失敗: 照合不一致", false)
                    }
                } catch (e: Exception) {
                    writeDebugLog("例外発生: ${e.javaClass.simpleName} - ${e.message}")
                    showHudBanner("⚠ 失敗: ${e.javaClass.simpleName}", false)
                }
            }

            private fun weightedAverage(samples: List<GpsRecord>): GpsRecord? {
                if (samples.isEmpty()) return null
                var wSum = 0.0; var latSum = 0.0; var lonSum = 0.0; var altSum = 0.0
                for (s in samples) {
                    val safeAcc = s.acc.toDouble().coerceAtLeast(0.5)
                    val w = 1.0 / (safeAcc * safeAcc)
                    wSum += w
                    latSum += s.lat * w
                    lonSum += s.lon * w
                    altSum += s.alt * w
                }
                val avgAcc = sqrt(1.0 / wSum)
                return GpsRecord(
                    timeMs = samples.last().timeMs,
                    lat = latSum / wSum,
                    lon = lonSum / wSum,
                    alt = altSum / wSum,
                    acc = avgAcc.toFloat()
                )
            }

            private fun startNotification() {
                val chId = "gps_overlay"
                val ch = NotificationChannel(chId, "GPS Overlay", NotificationManager.IMPORTANCE_LOW)
                getSystemService(NotificationManager::class.java).createNotificationChannel(ch)

                val stopIntent = Intent(this, OverlayService::class.java).apply { action = "ACTION_STOP" }
                val stopPendingIntent = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)

                val notif = NotificationCompat.Builder(this, chId)
                    .setContentTitle("GPSモニター & Exif自動同期中")
                    .setContentText("撮影時刻近傍の測位を加重平均してExifに反映します")
                    .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                    .addAction(android.R.drawable.ic_menu_close_clear_cancel, "終了する", stopPendingIntent)
                    .setOngoing(true)
                    .build()

                startForeground(1, notif)
            }

            override fun onDestroy() {
                super.onDestroy()
                mainHandler.removeCallbacks(debounceProcessRunnable)
                mainHandler.removeCallbacks(hideBannerRunnable)
                imageObserver?.let { contentResolver.unregisterContentObserver(it) }
                if (::locationManager.isInitialized) {
                    locationManager.removeUpdates(this)
                    try {
                        locationManager.unregisterGnssStatusCallback(gnssCallback)
                    } catch (e: Exception) {}
                }
                if (::overlayView.isInitialized) windowManager.removeView(overlayView)
                if (::bannerContainer.isInitialized) windowManager.removeView(bannerContainer)
                executor.shutdown()
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GPS_Overlay_App
        path: app/build/outputs/apk/debug/app-debug.apk
